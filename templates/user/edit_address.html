{% extends "user/base_user.html" %}

{% block title %}Edit Address{% endblock %}

{% block content %}
<div class="main-content">
<div class="container py-4">

    <div class="card p-4" style="max-width:650px; margin:auto; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">

        <h3 class="mb-4 text-center fw-bold">Edit Address</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ address.full_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{ address.phone }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 1</label>
                <input type="text" name="address_line1" class="form-control" value="{{ address.address_line1 }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 2</label>
                <input type="text" name="address_line2" class="form-control" value="{{ address.address_line2 }}">
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" value="{{ address.city }}" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control" value="{{ address.state }}" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Pincode</label>
                    <input type="text" name="pincode" class="form-control" value="{{ address.pincode }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Country</label>
                <input type="text" name="country" class="form-control" value="{{ address.country }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Update Address
            </button>

            <a href="/user/shipping-address" class="btn btn-secondary w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>

</div>
</div>
{% endblock %}
