{% extends "user/base_user.html" %}

{% block title %}Shipping Address{% endblock %}

{% block css %}
<style>
    .card-box {
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .address-card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
        background: #fff;
        transition: 0.3s;
        cursor: pointer;
    }

    .address-card:hover {
        border-color: #0d6efd;
        background: #f8fbff;
    }

    .form-control {
        border-radius: 10px;
    }

    .btn {
        border-radius: 10px;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}

<div class="main-content">
<div class="container py-4">

    <div class="card card-box p-4">

        <h3 class="mb-4 text-center fw-bold">Select Shipping Address</h3>

        <!-- ✅ FORM START -->
        <form method="POST">

            {% if addresses %}
            <h5 class="mb-3">Saved Addresses</h5>

            {% for address in addresses %}
            <div class="address-card">
                <div class="d-flex justify-content-between align-items-start gap-3">

                    <!-- LEFT SIDE -->
                    <div class="form-check flex-grow-1">

                        <input class="form-check-input"
                               type="radio"
                               name="selected_address_id"
                               value="{{ address.address_id }}"
                               id="addr{{ address.address_id }}">

                        <label class="form-check-label w-100" for="addr{{ address.address_id }}">
                            <strong>{{ address.full_name }}</strong> | {{ address.phone }} <br>
                            {{ address.address_line1 }},
                            {% if address.address_line2 %}{{ address.address_line2 }}, {% endif %}
                            {{ address.city }}, {{ address.state }} - {{ address.pincode }}, {{ address.country }}
                        </label>

                    </div>

                    <!-- RIGHT SIDE BUTTONS -->
                    <div class="d-flex flex-column gap-2">

                        <a href="/user/edit-address/{{ address.address_id }}"
                           class="btn btn-sm btn-warning"
                           onclick="event.stopPropagation();">
                            ✏️ Edit
                        </a>

                        <a href="/user/delete-address/{{ address.address_id }}"
                           class="btn btn-sm btn-danger"
                           onclick="event.stopPropagation(); return confirm('Delete this address?');">
                            🗑 Delete
                        </a>

                    </div>

                </div>
            </div>
            {% endfor %}

            <!-- ✅ USE EXISTING -->
            <button type="submit" name="action" value="use_existing"
                    class="btn btn-primary mb-4 w-100">
                Use Selected Address
            </button>

            <hr>
            {% endif %}

            <!-- ✅ NEW ADDRESS -->
            <h5 class="mb-3">Add New Address</h5>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 1</label>
                <input type="text" name="address_line1" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 2</label>
                <input type="text" name="address_line2" class="form-control">
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Pincode</label>
                    <input type="text" name="pincode" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Country</label>
                <input type="text" name="country" class="form-control" value="India">
            </div>

            <!-- ✅ SAVE NEW -->
            <button type="submit" name="action" value="save_new"
                    class="btn btn-success w-100">
                Save New Address & Continue
            </button>

        </form>
        <!-- ✅ FORM END -->

    </div>

</div>
</div>

{% endblock %}
