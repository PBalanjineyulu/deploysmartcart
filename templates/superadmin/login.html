{% extends "superadmin/base_superadmin.html" %}

{% block title %}Super Admin Login{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #0f172a;
        --accent: #2563eb;
        --accent2: #7c3aed;
        --accent-hover: #1d4ed8;
        --text-muted: #64748b;
    }

    /* ===== BACKGROUND DESIGN ===== */
    body {
        background:
            radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.2), transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.2), transparent 40%),
            linear-gradient(135deg, #eef2ff, #f8fafc, #eef2ff);
    }

    .login-wrapper {
        min-height: calc(100vh - 140px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    /* ===== CARD ===== */
    .login-card {
        width: 100%;
        max-width: 430px;

        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(18px);

        padding: 35px;
        border-radius: 20px;

        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.3);

        transition: 0.3s;
    }

    .login-card:hover {
        transform: translateY(-5px);
    }

    /* ===== ICON ===== */
    .icon-box {
        width: 70px;
        height: 70px;

        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        font-size: 28px;
        margin: 0 auto 18px;

        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    .login-card h2 {
        text-align: center;
        font-weight: 800;
        font-size: 1.9rem;
        margin-bottom: 25px;
        color: var(--primary);
    }

    /* ===== FORM ===== */
    .form-label {
        font-weight: 600;
        color: #0f172a;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px;
        min-height: 50px;
        border: 1px solid #e2e8f0;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
    }

    /* ===== BUTTON ===== */
    .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    /* ===== TEXT ===== */
    .auth-text {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .auth-link {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
    }

    .auth-link:hover {
        text-decoration: underline;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 576px) {
        .login-card {
            padding: 25px;
        }

        .login-wrapper {
            padding: 20px;
        }

        .login-card h2 {
            font-size: 1.5rem;
        }
    }

    @media (min-width: 1200px) {
        .login-card {
            max-width: 460px;
        }
    }
</style>
{% endblock %}

{% block content %}

<div class="login-wrapper">

    <div class="login-card">

        <div class="icon-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h2>Super Admin Login</h2>

        <form method="POST" action="/superadmin-login">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                    placeholder="Enter super admin email" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                    placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>

            <div class="auth-text mt-3 text-center">
                <a href="/sa-forgot-password" class="auth-link">Forgot Password?</a>
            </div>

            <div class="mt-3 text-center">
                <p class="auth-text">
                    Don't have an account?
                    <a href="/superadmin-register" class="auth-link">Register</a>
                </p>
            </div>

        </form>

    </div>

</div>

{% endblock %}
